<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auteurs - Bibliothèque-Mayela</title>

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="auteurs.css">
</head>

<body>

    <header>

        <h1>Bibliothèque-Mayela</h1>

        <nav>
            <a href="../livres/livres.html">Livres</a>
            <a href="../auteurs/auteurs.html">Auteurs</a>
            <a href="../adherents/adherents.html">Adhérents</a>
            <a href="../emprunts/emprunts.html">Emprunts</a>
            <a href="../dashboard/dashboard.html">Dashboard</a>
        </nav>

    </header>


    <main>

        <!-- =========================
             TITRE + MESSAGE
        ========================== -->

        <section>

            <h2>Gestion des auteurs</h2>

            <div id="message"></div>

        </section>


        <!-- =========================
             FORMULAIRE
        ========================== -->

        <section>

            <h2 id="formTitle">
                Ajouter un auteur
            </h2>


            <form id="auteurForm">

                <input
                    type="hidden"
                    id="auteurId"
                >


                <div>

                    <label for="nom">
                        Nom
                    </label>

                    <input
                        type="text"
                        id="nom"
                        maxlength="150"
                        required
                    >

                </div>


                <div>

                    <label for="nationalite">
                        Nationalité
                    </label>

                    <input
                        type="text"
                        id="nationalite"
                        maxlength="100"
                    >

                </div>


                <button
                    type="submit"
                    id="submitButton"
                >
                    Ajouter l'auteur
                </button>


                <button
                    type="button"
                    id="cancelButton"
                    hidden
                >
                    Annuler
                </button>

            </form>

        </section>


        <!-- =========================
             LISTE DES AUTEURS
        ========================== -->

        <section>

            <h2>Liste des auteurs</h2>

            <div id="loading">
                Chargement...
            </div>


            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Nationalité</th>
                        <th>Actions</th>
                    </tr>

                </thead>


                <tbody id="auteursTableBody">
                </tbody>

            </table>

        </section>

    </main>


    <script src="../JS/api.js"></script>
    <script src="auteurs.js"></script>

</body>

</html>
